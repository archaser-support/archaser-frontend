# Amplify Hosting (SSR) — app root must be `frontend` in Amplify Console.
# The frontend is UI-only: no database, no Prisma. All data comes from Nest.
# Stage 1B: use vendored `@archaser/openapi-client` (frontend/packages/openapi-client)
# via `utils/nestOpenApiClient.ts`. Do not point at ../backend — Amplify clones
# only this repo.
#
# Required console env, per branch (staging example):
#   AMPLIFY_SSR=true
#   NEXT_PUBLIC_AMPLIFY_UI=true
#   NEXT_PUBLIC_NEST_API_BASE_URL=https://api.staging.archaser.com
#   NEXT_PUBLIC_API_BASE_URL=https://api.staging.archaser.com/api
#     (Amplify-only product API base — local Next always uses same-origin /api)
#   NEXT_PUBLIC_BASE_URL=https://staging.archaser.com
#   NEXTAUTH_URL=https://staging.archaser.com
#   NEXTAUTH_SECRET=<signs the NextAuth cookie session>
#   JWT_SECRET=<same secret Nest uses to sign access tokens>
#   NEXT_PUBLIC_ENABLE_WS=true
#
# Nest staging `.env` on the API EC2 must include:
#   NEST_PUBLIC_URL=https://api.staging.archaser.com
#   NEST_AUTH_SUCCESS_REDIRECT=https://staging.archaser.com
#   NEST_CORS_ORIGINS=https://staging.archaser.com,<old amplifyapp.com until custom-domain soak>
#   NEXT_PUBLIC_BASE_URL=https://staging.archaser.com
#   NEXT_PUBLIC_NEST_API_BASE_URL=https://api.staging.archaser.com
#   ENABLE_CRON_JOBS=false
#
# Email pixels and account logos use NEST_PUBLIC_URL (the API host). Portal
# and login links in mail use NEXT_PUBLIC_BASE_URL (the UI host).
#
# NEXTAUTH_URL must match the branch domain — pointing it at another branch
# makes /api/auth/session fail. Nest must list this exact origin in
# NEST_CORS_ORIGINS. SSE uses EventSource against Nest /api/ws/* with
# ?access_token=.
#
# Amplify does not forward Console variables to the SSR runtime, so
# `build:amplify` writes the server-side ones into .env.production before
# building. `.env*` is gitignored, so the Console is the only source.

version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci --cache .npm --prefer-offline
        - npm run type-check
    build:
      commands:
        - npm run build:amplify
  artifacts:
    baseDirectory: .next
    files:
      - "**/*"
  # `npm ci` deletes node_modules before installing, so caching it only restores
  # a tree that is thrown away. Cache the npm download cache instead.
  cache:
    paths:
      - .npm/**/*
      - .next/cache/**/*
