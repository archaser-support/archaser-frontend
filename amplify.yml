# Amplify Hosting (SSR) — app root must be `frontend` in Amplify Console.
#
# Required console env (staging example):
#   AMPLIFY_SSR=true
#   NEXT_PUBLIC_AMPLIFY_UI=true
#   NEXT_PUBLIC_USE_NEST_AUTH=true
#   NEXT_PUBLIC_NEST_API_BASE_URL=https://staging.archaser.com
#   NEXT_PUBLIC_API_BASE_URL=https://staging.archaser.com/api
#   NEXT_PUBLIC_BASE_URL=https://<amplify-app-domain>
#   NEXTAUTH_SECRET=<shared with Nest JWT verify; omit DATABASE_URL>
#   JWT_SECRET=<same secret Nest uses to sign access tokens>
#   NEXT_PUBLIC_ENABLE_WS=true
#
# Nest must allow this origin in NEST_CORS_ORIGINS and Authorization header.
# SSE uses EventSource against Nest /api/ws/* with ?access_token=.

version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci
    build:
      commands:
        - npm run build:amplify
  artifacts:
    baseDirectory: .next
    files:
      - "**/*"
  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*
